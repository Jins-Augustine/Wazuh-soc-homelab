# Ubuntu Agent — FIM Configuration Snippet
# File: /var/ossec/etc/ossec.conf
# Add this inside the existing <syscheck> block

<syscheck>
  <!-- Scan frequency in seconds (default 43200 = 12 hours) -->
  <frequency>43200</frequency>

  <!-- Default monitored directories -->
  <directories>/etc,/usr/bin,/usr/sbin</directories>
  <directories>/bin,/sbin,/boot</directories>

  <!-- Custom monitored directory with real-time alerting -->
  <!-- realtime="yes" triggers alerts instantly instead of waiting for the next scan -->
  <directories realtime="yes">/home/vboxuser/Downloads/wazuh-test</directories>

</syscheck>
